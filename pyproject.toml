[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frc-advanced-evaluation-lab"
version = "0.1.0"
description = "Lab guiado de evaluación y adaptación de un asistente FRC"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
